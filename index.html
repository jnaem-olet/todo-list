<!DOCTYPE html>
<html lang="en">
<head>
    <title>To Do List</title>
    <!--responsive-->
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    
    <!--google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&display=swap" rel="stylesheet">    
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--my css file-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <main class="container mt-3">
        <section class="todo-list mx-auto">
            <!--dark mode-->
            <div class="text-end mb-5">
                <button id="darkModeButton" class="btn btn-dark btn-sm">DARK MODE</button>
            </div>

            <!-- title -->
            <h1 class="text-center mb-4">
                Today's TO-DO List
            </h1>
            
            <!--today's date-->
            <div class="today-date">

            </div>

            <!--input-->
            <div class="d-flex mb-3 gap-2">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a task">
                <input type="date" id="dueDateInput">
                <button id ="addTaskButton" class="btn btn-success">
                Add
                </button>
            </div>

            <!--show the task list-->
            <p id="taskCounter">Tasks = 0</p>
            <ul id="taskList" class="list-group"></ul>
        </section>

    
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
